<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Catálogo de complementos para decoração - DreamCraft Decorações">
  <title>Complementos para Decoração - DreamCraft</title>
  <link rel="icon" type="image/png" href="Logo/logo-decoracoes.png">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap">

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="stylecomplementos.css">
</head>
<body>

  <!-- IMPORTANTE: header.js procura exatamente este ID -->
  <div id="header-container"></div>

  <main class="complementos-page">
    <section class="catalogo-header">
      <h1>Complementos para Decoração</h1>
      <p>Itens especiais para complementar e personalizar sua decoração.</p>
    </section>

    <section class="filtros-container" aria-label="Filtros do catálogo">
      <div class="filtro-titulo">Filtrar por categoria:</div>
      <div class="categorias-grid" id="categoriasGrid">
        <button type="button" class="filtro-btn ativo" data-categoria="all">Todos</button>
        <button type="button" class="filtro-btn" data-categoria="led">Números LED</button>
        <button type="button" class="filtro-btn" data-categoria="acrilico">Acrílicos</button>
        <button type="button" class="filtro-btn" data-categoria="pedestais">Pedestais</button>
        <button type="button" class="filtro-btn" data-categoria="iluminacao">Iluminação</button>
        <button type="button" class="filtro-btn" data-categoria="espelhos">Espelhos</button>
        <button type="button" class="filtro-btn" data-categoria="flores">Flores e Arranjos</button>
        <button type="button" class="filtro-btn" data-categoria="especiais">Itens Especiais</button>
        <button type="button" class="filtro-btn" data-categoria="numero">Números</button>
      </div>

      <div class="controles-busca">
        <div class="busca-box">
          <i class="fas fa-search" aria-hidden="true"></i>
          <input type="search" id="buscaInput" placeholder="Buscar complemento..." autocomplete="off">
        </div>

        <select id="categoriaSelect" class="categoria-select" aria-label="Filtrar por categoria">
          <option value="all">Todas as categorias</option>
          <option value="led">Números LED</option>
          <option value="acrilico">Acrílicos</option>
          <option value="pedestais">Pedestais</option>
          <option value="iluminacao">Iluminação</option>
          <option value="espelhos">Espelhos</option>
          <option value="flores">Flores e Arranjos</option>
          <option value="especiais">Itens Especiais</option>
          <option value="numero">Números</option>
        </select>
      </div>
    </section>

    <section aria-label="Itens do catálogo">
      <div id="complementosGrid" class="complementos-grid"></div>

      <div id="semResultados" class="sem-resultados" hidden>
        <i class="fas fa-search" aria-hidden="true"></i>
        <p>Nenhum complemento encontrado com os filtros selecionados.</p>
      </div>
    </section>
  </main>

  <div id="footer-container"></div>

  <script src="header.js"></script>
  <script src="footer.js"></script>
  <script src="scriptcomplementos.js"></script>
</body>
</html>
