<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complementos para Decoração | DreamCraft</title>

    
    <link rel="stylesheet" href="stylecomplementos.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

    <div id="header"></div>

    <main>
        <section class="catalogo-header">
            <h1>Complementos para Decoração</h1>
            <p>Itens especiais para complementar e personalizar sua decoração.</p>

            <div class="filtros-catalogo">
                <div class="filtros-categorias" id="filtros-categorias">
                    <button class="filtro ativo" data-categoria="all">Todos</button>
                    <button class="filtro" data-categoria="led">Números LED</button>
                    <button class="filtro" data-categoria="acrilico">Acrílicos</button>
                    <button class="filtro" data-categoria="pedestais">Pedestais</button>
                    <button class="filtro" data-categoria="iluminacao">Iluminação</button>
                    <button class="filtro" data-categoria="espelhos">Espelhos</button>
                    <button class="filtro" data-categoria="flores">Flores e Arranjos</button>
                    <button class="filtro" data-categoria="especiais">Itens Especiais</button>
                    <button class="filtro" data-categoria="numero">Números</button>
                </div>

                <div class="filtros-controles">
                    <div class="campo-busca">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input type="search" id="busca-complemento"
                               placeholder="Buscar complemento...">
                    </div>

                    <select id="select-categoria" aria-label="Filtrar por categoria">
                        <option value="all">Todas as categorias</option>
                        <option value="led">Números LED</option>
                        <option value="acrilico">Acrílicos</option>
                        <option value="pedestais">Pedestais</option>
                        <option value="iluminacao">Iluminação</option>
                        <option value="espelhos">Espelhos</option>
                        <option value="flores">Flores e Arranjos</option>
                        <option value="especiais">Itens Especiais</option>
                    </select>

                    <button id="btn-visualizacao" class="btn-visualizacao"
                            type="button" title="Alterar visualização">
                        <i class="fa-solid fa-list"></i>
                        <span>Lista</span>
                    </button>
                </div>
            </div>
        </section>

        <section id="catalogo-complementos" class="catalogo grid" aria-live="polite"></section>

        <div id="modal-imagem" class="modal-imagem" aria-hidden="true">
            <button class="modal-fechar" type="button" aria-label="Fechar">
                <i class="fa-solid fa-xmark"></i>
            </button>

            <button class="modal-anterior" type="button" aria-label="Imagem anterior">
                <i class="fa-solid fa-chevron-left"></i>
            </button>

            <div class="modal-conteudo">
                <img id="imagem-modal" src="" alt="">
                <div id="contador-modal" class="contador-modal"></div>
            </div>

            <button class="modal-proxima" type="button" aria-label="Próxima imagem">
                <i class="fa-solid fa-chevron-right"></i>
            </button>
        </div>
    </main>

    <div id="footer"></div>

    <script src="header.js"></script>
    <script src="footer.js"></script>
    <script src="scriptcomplementos.js"></script>
</body>
</html>
