<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Catálogo de Complementos - DreamCraft</title>
  <link rel="icon" type="image/png" href="Logo/logo-decoracoes.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- CSS PRINCIPAL DO SITE -->
    <link rel="stylesheet" href="style.css">
    <!-- CSS PREMIUM -->
    <link rel="stylesheet" href="style-premium.css">
    <!-- CSS ESPECÍFICO DO CATÁLOGO -->
    <link rel="stylesheet" href="stylecomplementos.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <div id="header-container"></div>

  <main>
    <section class="catalogo-header">
      <h1>Complementos para Decoração</h1>
      <p>Itens especiais para complementar e personalizar sua decoração.</p>

      <div class="filtros-catalogo">

        <!-- Botões visuais (igual ao bolofake) -->
        <div class="filtros-categorias" id="filtros-categorias">
          <button class="filtro ativo" type="button" data-categoria="all">Todos</button>
          <button class="filtro" type="button" data-categoria="led">💡 Números LED</button>
          <button class="filtro" type="button" data-categoria="acrilico">🔷 Acrílicos</button>
          <button class="filtro" type="button" data-categoria="pedestais">🏛️ Pedestais</button>
          <button class="filtro" type="button" data-categoria="iluminacao">✨ Iluminação</button>
          <button class="filtro" type="button" data-categoria="espelhos">🪞 Espelhos</button>
          <button class="filtro" type="button" data-categoria="flores">🌸 Flores</button>
          <button class="filtro" type="button" data-categoria="especiais">⭐ Especiais</button>
          <button class="filtro" type="button" data-categoria="numero">🔢 Números</button>
        </div>

        <div class="filtros-controles">

          <!-- Campo de busca -->
          <div class="campo-busca">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="search" id="busca-complemento" placeholder="Buscar complemento..." autocomplete="off">
          </div>

          <!-- Select dropdown -->
          <select id="select-categoria" aria-label="Filtrar por categoria">
            <option value="all">Todas as categorias</option>
            <option value="led">Números LED</option>
            <option value="acrilico">Acrílicos</option>
            <option value="pedestais">Pedestais</option>
            <option value="iluminacao">Iluminação</option>
            <option value="espelhos">Espelhos</option>
            <option value="flores">Flores e Arranjos</option>
            <option value="especiais">Itens Especiais</option>
            <option value="numero">Números</option>
         </select>
</div>

<div class="controlevisualizacao">
    <button type="button">Alternar Lista / Grade</button>
</div>

<div class="catalogo grid" id="catalogo-festas"></div>

     
  <div id="footer-container"></div>

<script src="header.js"></script>
<script src="footer.js"></script>
<script src="scriptdecor.js"></script>
</body>
</html>
