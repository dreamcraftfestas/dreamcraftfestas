<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complementos para Decoração - DreamCraft Festas</title>
  <link rel="icon" type="image/png" href="Logo/logo-decoracoes.png">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap">
  
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="stylecomplementos.css">
</head>
<body>

  <div id="header-placeholder"></div>

  <main class="complementos-page">
    <section class="catalogo-header">
      <h1>Complementos para Decoração</h1>
      <p>Itens especiais para complementar e personalizar sua decoração.</p>

      <div class="filtros-container">
        <div class="categorias-grid">
          <button class="filtro-btn ativo" data-categoria="all">Todos</button>
          <button class="filtro-btn" data-categoria="led">Números LED</button>
          <button class="filtro-btn" data-categoria="acrilico">Acrílicos</button>
          <button class="filtro-btn" data-categoria="pedestais">Pedestais</button>
          <button class="filtro-btn" data-categoria="iluminacao">Iluminação</button>
          <button class="filtro-btn" data-categoria="espelhos">Espelhos</button>
          <button class="filtro-btn" data-categoria="flores">Flores e Arranjos</button>
          <button class="filtro-btn" data-categoria="especiais">Itens Especiais</button>
          <button class="filtro-btn" data-categoria="numero">Números</button>
        </div>

        <div class="controles-busca">
          <div class="busca-box">
            <i class="fas fa-search"></i>
            <input type="text" id="buscaInput" placeholder="Buscar complemento...">
          </div>

          <select id="categoriaSelect" class="categoria-select" aria-label="Filtrar por categoria">
            <option value="all">Todas as categorias</option>
            <option value="led">Números LED</option>
            <option value="acrilico">Acrílicos</option>
            <option value="pedestais">Pedestais</option>
            <option value="iluminacao">Iluminação</option>
            <option value="espelhos">Espelhos</option>
            <option value="flores">Flores e Arranjos</option>
            <option value="especiais">Itens Especiais</option>
            <option value="numero">Números</option>
          </select>
        </div>
      </div>

      <div id="complementosGrid" class="complementos-grid">
        <!-- Cards gerados via JS -->
      </div>

      <div id="semResultados" class="sem-resultados" style="display: none;">
        <i class="fas fa-search"></i>
        <p>Nenhum complemento encontrado com os filtros selecionados.</p>
      </div>
    </section>
  </main>

  <div id="footer-placeholder"></div>

  <script src="header-footer.js"></script>
  <script src="scriptcomplementos.js"></script>
</body>
</html>
